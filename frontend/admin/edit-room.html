<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Room</title>
    <link rel="stylesheet" href="edit-room.css">
</head>
<body>
    <header>
        <h1>Edit Room Details</h1>
        <a href="admin-dashboard.html">Back to Admin Panel</a>
    </header>

    <section class="edit-room-container">
        <h2>Update Room Information</h2>
        <form id="edit-room-form">
            <label for="room-type">Room Type:</label>
            <select id="room-type">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="shared">Shared</option>
            </select>

            <label for="capacity">Capacity:</label>
            <input type="number" id="capacity" min="1" required>

            <label for="price">Price (per month):</label>
            <input type="number" id="price" min="1" required>

            <button type="submit">Update Room</button>
        </form>
    </section>

    <script src="edit-room.js"></script>
</body>
</html>
