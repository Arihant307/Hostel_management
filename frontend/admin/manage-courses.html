<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses</title>
    <link rel="stylesheet" href="manage-courses.css">
</head>
<body>
    <header>
        <h1>Manage Courses</h1>
        <a href="admin-dashboard.html">Back to Admin Panel</a>
    </header>

    <section class="course-container">
        <h2>Available Courses</h2>
        <table>
            <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="course-list">
                <!-- Courses will be dynamically loaded here -->
            </tbody>
        </table>
        <button onclick="openAddCourseModal()">Add New Course</button>
    </section>

    <!-- Add Course Modal -->
    <div id="addCourseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddCourseModal()">&times;</span>
            <h2>Add New Course</h2>
            <form id="add-course-form">
                <label for="course-name">Course Name:</label>
                <input type="text" id="course-name" required>

                <label for="course-desc">Description:</label>
                <textarea id="course-desc" required></textarea>

                <button type="submit">Add Course</button>
            </form>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="manage-courses.js"></script>
</body>
</html>
