<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms</title>
    <link rel="stylesheet" href="manage-rooms.css">
</head>
<body>
    <header>
        <h1>Manage Rooms</h1>
        <a href="admin-dashboard.html">Back to Admin Panel</a>
    </header>

    <section class="room-container">
        <h2>Available Rooms</h2>
        <table>
            <thead>
                <tr>
                    <th>Room Number</th>
                    <th>Type</th>
                    <th>Capacity</th>
                    <th>Occupied</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="room-list">
                <!-- Rooms will be dynamically loaded here -->
            </tbody>
        </table>
        <button onclick="openAddRoomModal()">Add New Room</button>
    </section>

    <!-- Add Room Modal -->
    <div id="addRoomModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddRoomModal()">&times;</span>
            <h2>Add New Room</h2>
            <form id="add-room-form">
                <label for="room-number">Room Number:</label>
                <input type="text" id="room-number" required>

                <label for="room-type">Room Type:</label>
                <select id="room-type">
                    <option value="Single">Single</option>
                    <option value="Double">Double</option>
                    <option value="Shared">Shared</option>
                </select>

                <label for="capacity">Capacity:</label>
                <input type="number" id="capacity" min="1" required>

                <button type="submit">Add Room</button>
            </form>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="manage-rooms.js"></script>
</body>
</html>
