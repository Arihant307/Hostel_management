<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Payment</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <header>
        <h1>Student Payment Portal</h1>
        <a href="admin-dashboard.html">Back to Admin Dashboard</a>
        <a href="payment-history.html">Payment History</a>
    </header>

    <section class="payment-container">
        <h2>Make a Payment</h2>
        <form id="payment-form">
            <label for="student-id">Student ID or Email:</label>
            <input type="text" id="student-id" placeholder="e.g. 3 or student@example.com" required>

            <label for="amount">Amount (in $):</label>
            <input type="number" id="amount" min="1" required>

            <label for="payment-method">Payment Method:</label>
            <select id="payment-method">
                <option value="credit-card">Credit Card</option>
                <option value="debit-card">Debit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank-transfer">Bank Transfer</option>
            </select>

            <button type="submit">Submit Payment</button>
        </form>
    </section>

    <script src="../config.js"></script>
    <script src="payment.js"></script>
</body>
</html>
