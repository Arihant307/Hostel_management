
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hostel Management System</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header>
        <h1>Register for Hostel Management System</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index1.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html" class="active">Register</a></li>
        </ul>
    </nav>

    <section class="register-container">
        <h2>Create an Account</h2>
        <form id="register-form" action="login.html" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <label for="room">Room Preference:</label>
            <select id="room" name="room">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="shared">Shared</option>
            </select>

            <button type="submit">Register</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Hostel Management System</p>
    </footer>

    <script src="../config.js"></script>
    <script src="register.js"></script>
</body>
</html>
