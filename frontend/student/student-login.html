<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="./student-login.css">
</head>
<body>
    <header>
        <div class="header-flex">
            <h1 style="margin: 0;">Student Login</h1>
            <a href="../admin/index1.html" class="home-btn">Home</a>
            <a href="student-registration.html" class="register-btn">Student Registration</a>
        </div>
    </header>
    <section class="login-container">
        <form id="student-login-form">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="./student-registration.html">Register here</a></p>
    </section>
    <script src="../config.js"></script>
    <script src="./student-login.js"></script>
</body>
</html>
