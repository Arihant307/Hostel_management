# Render Blueprint: one free web service (Flask API + frontend) and one free
# PostgreSQL database. Deploy via Render Dashboard -> New -> Blueprint.
# See README.md ("Deploying to Render") for details and free-tier limits.
services:
  - type: web
    name: hostel-management
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --preload --workers 2 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      # You are prompted for these when the Blueprint is created.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hostel-db
    plan: free
    databaseName: hostel
    user: hostel
    # Only services in this Render account can connect (no public access).
    ipAllowList: []
