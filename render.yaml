# Render Blueprint: one free web service (Flask API + frontend).
# The database is hosted on Neon (free); its URL is set as DATABASE_URL.
services:
  - type: web
    name: hostel-management
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --preload --workers 2 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # You are prompted for these when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false